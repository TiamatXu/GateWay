[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
smol_str = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rstest = "0.25"
proptest = "1"
serde_json_path = "0.7"
gw-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
