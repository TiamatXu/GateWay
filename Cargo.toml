[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
smol_str = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
smallvec = { version = "1", features = ["serde", "union"] }
tracing = "0.1"
metrics = "0.24"
bytes = "1"
futures-core = "0.3"
futures = "0.3"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["http2"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio", "tls12"] }
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
figment = { version = "0.10", features = ["toml", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
url = { version = "2", features = ["serde"] }
tiktoken-rs = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rstest = "0.25"
proptest = "1"
serde_json_path = "0.7"
serde-saphyr = "1"
schemars = "1"
matchit = "0.8"
arc-swap = "1"
gw-core = { path = "crates/core" }
gw-store = { path = "crates/store" }
gw-pricing = { path = "crates/pricing" }
gw-ledger = { path = "crates/ledger" }
gw-meter = { path = "crates/meter" }
gw-gateway = { path = "crates/gateway" }
gw-proxy = { path = "crates/proxy" }
gw-infra = { path = "crates/infra" }
gw-bin = { path = "crates/bin" }
gw-registry = { path = "crates/registry" }
gw-router = { path = "crates/router" }
gw-identity = { path = "crates/identity" }
gw-resource = { path = "crates/resource" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
